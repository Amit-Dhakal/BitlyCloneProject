version: "3.8"

services:
  dbservices:
    image: mysql:latest
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1
      MYSQL_DATABASE: bitlydb
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - ./data:/var/lib/mysql

  backendservices:
    build: .
    depends_on:
      dbservices:
        condition: service_healthy
    environment:
      - spring.datasource.url=jdbc:mysql://dbservices:3306/bitlydb
      - spring.datasource.username=root
      - spring.datasource.password=root1
      - spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
      - spring.jpa.hibernate.ddl-auto=update
#      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"
    restart: unless-stopped